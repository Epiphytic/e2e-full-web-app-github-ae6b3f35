{% if tables is defined and tables|length > 0 %}
<table>
    <thead>
        <tr>
            <th>Table Name</th>
            <th style="width: 150px;">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for table in tables %}
        <tr>
            <td><a href="/tables/{{ table }}">{{ table }}</a></td>
            <td>
                <div class="actions">
                    <a href="/tables/{{ table }}" class="btn btn-sm btn-primary">View</a>
                    <button class="btn btn-sm btn-danger"
                            hx-delete="/api/tables/{{ table }}"
                            hx-headers='{"HX-Request": "true"}'
                            hx-confirm="Are you sure you want to delete table '{{ table }}'?"
                            hx-on::after-request="if(event.detail.successful) window.location.reload();">
                        Delete
                    </button>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<div class="empty-state">
    <p>No tables yet. Create one to get started.</p>
</div>
{% endif %}
