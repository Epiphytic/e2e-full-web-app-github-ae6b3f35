<div style="padding: 1rem; background: #f8f9fa; border-radius: 4px;">
    <h4 style="margin-bottom: 0.75rem;">Add Column</h4>
    <form id="add-column-form">
        <div class="form-row">
            <div class="form-group">
                <label>Column Name</label>
                <input type="text" id="new-col-name" pattern="[a-zA-Z_][a-zA-Z0-9_]*" required placeholder="column_name">
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="new-col-type">
                    <option value="TEXT">TEXT</option>
                    <option value="INTEGER">INTEGER</option>
                    <option value="REAL">REAL</option>
                    <option value="BLOB">BLOB</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nullable</label>
                <select id="new-col-nullable">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-success">Add</button>
            </div>
        </div>
    </form>
</div>

<script>
document.getElementById('add-column-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var data = {
        name: document.getElementById('new-col-name').value,
        col_type: document.getElementById('new-col-type').value,
        nullable: document.getElementById('new-col-nullable').value === 'true',
        default_value: null
    };

    fetch('/api/tables/{{ table_name }}/columns', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'HX-Request': 'true'
        },
        body: JSON.stringify(data)
    }).then(function() {
        window.location.reload();
    });
});
</script>
