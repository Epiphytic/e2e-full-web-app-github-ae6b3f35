name: Lint

# TASK GRANULARITY: This workflow (and dependency-review.yml) is a foundational
# quality gate. It MUST be introduced as a separate, standalone task during the
# Foundation phase — before any application code is written. Bundling CI/CD
# quality checks into a later feature commit means lint violations accumulate
# silently and surface all at once, defeating the purpose of automated linting.
#
# Recommended project task ordering:
#   1. Foundation: project scaffold, .gitignore, Cargo.toml
#   2. CI Quality Gates: lint.yml, dependency-review.yml  <-- THIS TASK
#   3. Application code: auth, database, routes, templates
#   4. Test workflows: test.yml, E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  lint:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_RUST_CLIPPY: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_HTML: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_GITHUB_ACTIONS: true
          FILTER_REGEX_EXCLUDE: "(node_modules|target|test-results)/.*"
